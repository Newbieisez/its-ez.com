# Triggered after source verification
name: Restore Josh Applebaum recommendation

on:
  push:
    paths:
      - '.github/workflows/restore-josh-recommendation.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified LinkedIn recommendation
        shell: python
        run: |
          from pathlib import Path

          post_url = "https://www.linkedin.com/feed/update/urn:li:activity:7364027957989830656/"

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")
          if "7364027957989830656" not in text:
              marker = '<div class="recommendation-grid">\n'
              card = f'''<article class="recommendation-card sentinel"><blockquote>“The kind of enabler every company wishes they had.”</blockquote><div class="recommendation-meta"><span class="recommendation-name">Josh Applebaum</span><span class="recommendation-role">SentinelOne</span><span class="recommendation-rel">SentinelOne colleague</span><br><a class="recommendation-link" href="{post_url}" target="_blank" rel="noopener">View original LinkedIn post ↗</a></div></article>\n'''
              if marker not in text:
                  raise SystemExit("Homepage recommendation grid marker not found")
              text = text.replace(marker, marker + card, 1)
              index.write_text(text, encoding="utf-8")

          recs = Path("recommendations.html")
          text = recs.read_text(encoding="utf-8")
          if "7364027957989830656" not in text:
              marker = '<div class="grid" id="recommendation-grid">\n'
              card = f'''<article class="card" data-company="SentinelOne"><blockquote>“The kind of enabler every company wishes they had.”</blockquote><div class="card-meta"><span class="name">Josh Applebaum</span><span class="role">SentinelOne</span><span class="relationship">SentinelOne colleague</span><br><a class="profile-link" href="{post_url}" target="_blank" rel="noopener">View original LinkedIn post ↗</a></div></article>\n'''
              if marker not in text:
                  raise SystemExit("Recommendations page grid marker not found")
              text = text.replace(marker, marker + card, 1)
              recs.write_text(text, encoding="utf-8")

      - name: Commit restored recommendation
        run: |
          if git diff --quiet; then
            echo "Josh recommendation already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html recommendations.html
          git commit -m "Restore Josh Applebaum LinkedIn recommendation"
          git push
