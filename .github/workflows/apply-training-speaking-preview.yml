name: Apply training and speaking preview

on:
  push:
    branches:
      - preview/ez-brand-full-story-2026-09-11
    paths:
      - 'training-speaking-patch.py'
      - '.github/workflows/apply-training-speaking-preview.yml'

permissions:
  contents: write

jobs:
  apply-training-speaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/ez-brand-full-story-2026-09-11
          fetch-depth: 0
      - name: Apply case study and service updates
        run: python training-speaking-patch.py
      - name: Validate case study JavaScript
        run: node --check projects-core.js
      - name: Validate expected content
        shell: bash
        run: |
          set -euo pipefail
          grep -F "id:'training-facilitation-speaking'" projects-core.js
          grep -F 'Black Hat' projects-core.js
          grep -F 'Fortune 500' projects-core.js
          grep -F 'Corporate training, facilitation & speaking' work-with-me.html
          grep -F 'Manager development and leadership facilitation' work-with-me.html
          grep -F 'Corporate Training & Facilitation' index.html
          grep -F '06 / LEAD THE ROOM' index.html
      - name: Commit preview updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EZ Preview Builder"
          git config user.email "actions@users.noreply.github.com"
          git add projects-core.js work-with-me.html index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m "Add corporate training facilitation and speaking proof"
          git push origin HEAD:preview/ez-brand-full-story-2026-09-11
