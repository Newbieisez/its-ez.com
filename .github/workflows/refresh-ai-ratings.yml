name: Refresh AI Systems EZ Scores

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'ai-systems.js'
      - 'ai-systems-extended.js'
      - 'ai-systems-categories.js'
      - 'ai-systems-platform-links.js'
      - 'ai-systems-ratings.js'
      - 'ai-systems-ratings.css'
      - 'scripts/refresh-ai-ratings.mjs'
      - 'data/ai-rating-sources.json'
      - '.github/workflows/refresh-ai-ratings.yml'
  pull_request:
    paths:
      - 'ai-systems.js'
      - 'ai-systems-extended.js'
      - 'ai-systems-categories.js'
      - 'ai-systems-platform-links.js'
      - 'ai-systems-ratings.js'
      - 'ai-systems-ratings.css'
      - 'scripts/refresh-ai-ratings.mjs'
      - 'data/ai-rating-sources.json'
      - '.github/workflows/refresh-ai-ratings.yml'

permissions:
  contents: write

concurrency:
  group: refresh-ai-systems-ratings-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check AI Systems browser code
        run: |
          node --check ai-systems-ratings.js
          node --check ai-systems-categories.js
          node --check ai-systems-platform-links.js
          node --check scripts/refresh-ai-ratings.mjs

      - name: Refresh scores
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRUSTRADIUS_API_KEY: ${{ secrets.TRUSTRADIUS_API_KEY }}
        run: node scripts/refresh-ai-ratings.mjs

      - name: Validate output
        run: |
          node -e "const x=require('./data/ai-systems-ratings.json'); if(x.summary.total!==126) throw new Error('ratings inventory must contain 126 platforms'); if(Object.keys(x.items).length!==126) throw new Error('ratings output must contain 126 item records'); if(x.methodologyVersion!=='2.0') throw new Error('EZ Score methodology must be v2.0'); console.log(x.summary)"

      - name: Commit changed snapshots
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- data/ai-systems-ratings.json data/ai-systems-rating-history.json; then
            echo 'No rating changes.'
            exit 0
          fi

          git config user.name 'EZ Ratings Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/ai-systems-ratings.json data/ai-systems-rating-history.json
          git commit -m 'chore: refresh AI Systems EZ Scores'

          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}/3"
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep $((attempt * 2))
          done

          echo 'Unable to publish refreshed EZ Scores after 3 attempts.' >&2
          exit 1