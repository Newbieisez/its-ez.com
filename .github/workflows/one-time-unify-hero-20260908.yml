name: One-time real JPEG homepage hero

on:
  push:
    paths:
      - .github/workflows/one-time-unify-hero-20260908.yml

permissions:
  contents: write

jobs:
  fix-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build real JPEG and remove SVG image override
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          TAG = "20260908-real-jpeg-2"
          SOURCE_SVG = Path("assets/ez-headshot-500-fixed.svg")
          JPEG_PATH = Path("assets/erez-hero-headshot.jpg")

          # Decode the exact approved headshot into a normal binary JPEG.
          # The old SVG omitted base64 padding, which browsers handled inconsistently.
          svg = SOURCE_SVG.read_text(encoding="utf-8")
          match = re.search(r'data:image/jpeg;base64,([^"\']+)', svg)
          if not match:
              raise SystemExit("Could not find embedded JPEG in approved headshot SVG")
          raw = re.sub(r'\s+', '', match.group(1))
          raw += '=' * (-len(raw) % 4)
          jpeg = base64.b64decode(raw)
          if not jpeg.startswith(b'\xff\xd8\xff') or not jpeg.endswith(b'\xff\xd9'):
              raise SystemExit("Decoded headshot is not a valid JPEG stream")
          if len(jpeg) < 15000:
              raise SystemExit(f"Decoded JPEG unexpectedly small: {len(jpeg)} bytes")
          JPEG_PATH.write_bytes(jpeg)

          # Initial HTML points directly to the actual JPEG.
          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          html = re.sub(r'\?v=[^"\'\s>]+', f'?v={TAG}', html)
          html = re.sub(
              r'<img\s+class="ez-hero-portrait"[^>]*>',
              f'<img class="ez-hero-portrait" src="assets/erez-hero-headshot.jpg?v={TAG}" alt="Erez Haimowicz in a black blazer and black shirt" width="500" height="500" loading="eager" fetchpriority="high" decoding="async">',
              html,
              count=1,
              flags=re.S,
          )
          index.write_text(html, encoding="utf-8")

          # CSS controls layout only. It must never replace the image source.
          css_file = Path("homepage-extras.css")
          css = css_file.read_text(encoding="utf-8")
          css = re.sub(r'\n\s*content\s*:\s*url\([^;]+\)\s*!important\s*;', '', css, flags=re.I)
          css = css.replace("ez-headshot-500-fixed.svg", "erez-hero-headshot.jpg")
          css = css.replace("ez-hero-portrait-2026-hires.svg", "erez-hero-headshot.jpg")
          css = re.sub(r'\?v=[^\'\")\s]+', f'?v={TAG}', css)
          css_file.write_text(css, encoding="utf-8")

          nav = Path("global-nav.js")
          js = nav.read_text(encoding="utf-8")
          js = re.sub(r"const VERSION = '[^']+';", f"const VERSION = '{TAG}';", js, count=1)
          js = re.sub(r"responsive-2026\.css\?v=[^'\"]+", f"responsive-2026.css?v={TAG}", js)
          nav.write_text(js, encoding="utf-8")

          # Refuse to ship the old broken delivery paths.
          final_html = index.read_text(encoding="utf-8")
          final_css = css_file.read_text(encoding="utf-8")
          final_js = nav.read_text(encoding="utf-8")
          assert f'assets/erez-hero-headshot.jpg?v={TAG}' in final_html
          assert 'ez-headshot-500-fixed.svg' not in final_html
          assert 'ez-hero-portrait-2026-hires.svg' not in final_html
          portrait_rule = re.search(r'body\.ez-homepage \.hero\.hero-2026 \.ez-hero-portrait\s*\{(.*?)\}', final_css, re.S)
          assert portrait_rule and 'content:' not in portrait_rule.group(1).lower()
          assert f'homepage-extras.css?v={TAG}' in final_html
          assert f'global-nav.js?v={TAG}' in final_html
          assert f"const VERSION = '{TAG}';" in final_js
          assert JPEG_PATH.stat().st_size == len(jpeg)
          print(f"Real JPEG hero ready: {JPEG_PATH} ({len(jpeg)} bytes), tag={TAG}")
          PY

          file assets/erez-hero-headshot.jpg
          file assets/erez-hero-headshot.jpg | grep -q "JPEG image data"
          grep -q 'src="assets/erez-hero-headshot.jpg?v=20260908-real-jpeg-2"' index.html
          ! grep -q 'content:url.*ez-headshot\|content:url.*ez-hero-portrait' homepage-extras.css

      - name: Commit real JPEG hero fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html homepage-extras.css global-nav.js assets/erez-hero-headshot.jpg
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Use real JPEG for homepage hero portrait"
          git push origin HEAD:main
