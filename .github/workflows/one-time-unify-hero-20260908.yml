name: One-time unify homepage hero

on:
  push:
    paths:
      - .github/workflows/one-time-unify-hero-20260908.yml

permissions:
  contents: write

jobs:
  fix-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unify current homepage hero build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          TAG = "20260908-unified-hero-4"
          PORTRAIT = "assets/ez-hero-portrait-2026-hires.svg"

          # ------------------------------------------------------------------
          # index.html: one cache tag everywhere + portrait in initial HTML.
          # ------------------------------------------------------------------
          index = Path("index.html")
          html = index.read_text(encoding="utf-8")

          # Eliminate every stale homepage cache tag, not just selected assets.
          html = re.sub(r'\?v=[^"\'\s>]+', f'?v={TAG}', html)

          # Make sure global-nav itself is cache-busted with the same tag.
          html = re.sub(
              r'<script\s+src="global-nav\.js(?:\?v=[^"]*)?"\s+defer></script>',
              f'<script src="global-nav.js?v={TAG}" defer></script>',
              html,
              count=1,
          )

          # Exact user-supplied portrait is present in the static HTML on first paint.
          hero_img = (
              f'<img class="ez-hero-portrait" '
              f'src="{PORTRAIT}?v={TAG}" '
              f'alt="Erez Haimowicz in a black blazer and black shirt" '
              f'width="1254" height="1254" loading="eager" '
              f'fetchpriority="high" decoding="async">'
          )
          html, hero_count = re.subn(
              r'<img\s+class="ez-hero-portrait"[^>]*>',
              hero_img,
              html,
              count=1,
              flags=re.S,
          )
          if hero_count != 1:
              raise SystemExit(f"Expected one hero portrait, found {hero_count}")

          index.write_text(html, encoding="utf-8")

          # ------------------------------------------------------------------
          # homepage-extras.css is the CURRENT authoritative homepage hero CSS.
          # Keep the exact portrait and Vegas background on the same release tag.
          # ------------------------------------------------------------------
          home_css_file = Path("homepage-extras.css")
          home_css = home_css_file.read_text(encoding="utf-8")
          home_css = re.sub(r'\?v=[^\'\")\s]+', f'?v={TAG}', home_css)
          home_css_file.write_text(home_css, encoding="utf-8")

          # ------------------------------------------------------------------
          # global-nav.js: same release tag and NO runtime portrait src mutation.
          # ------------------------------------------------------------------
          nav = Path("global-nav.js")
          js = nav.read_text(encoding="utf-8")
          js = re.sub(r"const VERSION = '[^']+';", f"const VERSION = '{TAG}';", js, count=1)
          js = re.sub(
              r"responsive-2026\.css\?v=[^'\"]+",
              f"responsive-2026.css?v={TAG}",
              js,
          )

          # Remove the function that changed the hero image after initial paint.
          js, removed = re.subn(
              r'\n\s*function installHeroPortrait\(\)\{.*?\n\s*\}\n',
              '\n',
              js,
              count=1,
              flags=re.S,
          )
          if removed != 1:
              raise SystemExit("Could not locate installHeroPortrait runtime swap")
          js = re.sub(r'\n\s*installHeroPortrait\(\);', '', js)
          nav.write_text(js, encoding="utf-8")

          # ------------------------------------------------------------------
          # Verification: no split state is allowed to ship.
          # ------------------------------------------------------------------
          final_html = index.read_text(encoding="utf-8")
          final_css = home_css_file.read_text(encoding="utf-8")
          final_js = nav.read_text(encoding="utf-8")

          html_tags = set(re.findall(r'\?v=([^"\'\s>]+)', final_html))
          if html_tags != {TAG}:
              raise SystemExit(f"HTML cache tags are not unified: {sorted(html_tags)}")

          assert f'homepage-extras.css?v={TAG}' in final_html
          assert f'global-nav.js?v={TAG}' in final_html
          assert f'{PORTRAIT}?v={TAG}' in final_html
          assert 'loading="eager"' in final_html
          assert 'fetchpriority="high"' in final_html
          assert f"const VERSION = '{TAG}';" in final_js
          assert f"responsive-2026.css?v={TAG}" in final_js
          assert "installHeroPortrait" not in final_js
          assert ".ez-hero-portrait" not in final_js
          assert f"ez-hero-portrait-2026-hires.svg?v={TAG}" in final_css
          assert f"las-vegas-hero-bg.jpg?v={TAG}" in final_css
          assert "20260907-approved-1" not in final_html
          assert "20260908-hero-rebuild-3" not in final_html
          assert "20260908-exact-user-headshot-2" not in final_html

          print("Current homepage hero unified successfully with", TAG)
          PY

      - name: Commit hero fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html homepage-extras.css global-nav.js
          git commit -m "Unify current homepage hero and remove runtime image swap"
          git push origin HEAD:main
