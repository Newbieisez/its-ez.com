name: Lock homepage offer card hover

on:
  push:
    paths:
      - .github/workflows/one-time-unify-hero-20260908.yml

permissions:
  contents: write

jobs:
  fix-offer-hover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock offer cards to light hover treatment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          TAG = '20260908-offers-hover-fix-1'
          css_path = Path('homepage-extras.css')
          index_path = Path('index.html')
          nav_path = Path('global-nav.js')

          css = css_path.read_text(encoding='utf-8')
          start = '/* EZ HOME OFFER HOVER GUARD START */'
          end = '/* EZ HOME OFFER HOVER GUARD END */'
          css = re.sub(re.escape(start) + r'.*?' + re.escape(end), '', css, flags=re.S)
          css += f'''\n\n{start}\nbody.ez-homepage .home-offer:hover,\nbody.ez-homepage .home-offer:focus,\nbody.ez-homepage .home-offer:focus-visible,\nbody.ez-homepage .home-offer:active{{\n  background:#fff!important;\n  background-color:#fff!important;\n  color:#0a0b0d!important;\n  border-color:rgba(239,35,60,.38)!important;\n  box-shadow:0 18px 42px rgba(10,11,13,.10)!important;\n  transform:translateY(-4px)!important;\n  opacity:1!important;\n  filter:none!important;\n}}\nbody.ez-homepage .home-offer:hover small,\nbody.ez-homepage .home-offer:focus-visible small,\nbody.ez-homepage .home-offer:active small{{color:#ef233c!important}}\nbody.ez-homepage .home-offer:hover strong,\nbody.ez-homepage .home-offer:focus-visible strong,\nbody.ez-homepage .home-offer:active strong{{color:#0a0b0d!important}}\nbody.ez-homepage .home-offer:hover span,\nbody.ez-homepage .home-offer:focus-visible span,\nbody.ez-homepage .home-offer:active span{{color:#555c64!important}}\nbody.ez-homepage .home-offer:hover::before,\nbody.ez-homepage .home-offer:focus-visible::before,\nbody.ez-homepage .home-offer:active::before{{background:#ef233c!important;opacity:1!important}}\n{end}\n'''
          css_path.write_text(css, encoding='utf-8')

          html = index_path.read_text(encoding='utf-8')
          html = re.sub(r'homepage-extras\.css\?v=[^"\']+', f'homepage-extras.css?v={TAG}', html, count=1)
          index_path.write_text(html, encoding='utf-8')

          nav = nav_path.read_text(encoding='utf-8')
          nav = re.sub(r"const VERSION = '[^']+';", f"const VERSION = '{TAG}';", nav, count=1)
          nav_path.write_text(nav, encoding='utf-8')

          final_css = css_path.read_text(encoding='utf-8')
          assert 'background-color:#fff!important' in final_css
          assert 'body.ez-homepage .home-offer:hover strong' in final_css
          print('Offer hover guard applied')
          PY

      - name: Commit hover fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add homepage-extras.css index.html global-nav.js
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Keep homepage offer cards light on hover"
          git push origin HEAD:main
