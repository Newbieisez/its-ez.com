name: One-time unify homepage hero

on:
  push:
    paths:
      - .github/workflows/one-time-unify-hero-20260908.yml

permissions:
  contents: write

jobs:
  fix-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unify hero assets and remove runtime portrait swap
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          TAG = "20260908-unified-hero-2"

          # 1) Initial HTML: one cache tag + exact supplied headshot at first paint.
          index = Path("index.html")
          html = index.read_text(encoding="utf-8")

          for asset in ["projects.css", "wow.css", "contrast.css", "homepage-extras.css", "hero-final.css"]:
              html = re.sub(
                  rf'({re.escape(asset)})\?v=[^"\']+',
                  rf'\1?v={TAG}',
                  html,
              )

          html = re.sub(
              r'<script\s+src="global-nav\.js(?:\?v=[^"]*)?"\s+defer></script>',
              f'<script src="global-nav.js?v={TAG}" defer></script>',
              html,
              count=1,
          )

          hero_img = (
              f'<img class="ez-hero-portrait" '
              f'src="assets/ez-hero-portrait-2026-hires.svg?v={TAG}" '
              f'alt="Erez Haimowicz in a black blazer and black shirt" '
              f'width="1254" height="1254" loading="eager" fetchpriority="high" decoding="sync">'
          )
          html, count = re.subn(
              r'<img\s+class="ez-hero-portrait"[^>]*>',
              hero_img,
              html,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"Expected exactly one hero portrait image, found {count}")

          index.write_text(html, encoding="utf-8")

          # 2) Client script: use the same release tag and remove image src mutation.
          nav = Path("global-nav.js")
          js = nav.read_text(encoding="utf-8")
          js = re.sub(r"const VERSION = '[^']+';", f"const VERSION = '{TAG}';", js, count=1)
          js = re.sub(r"responsive-2026\.css\?v=[^'\"]+", f"responsive-2026.css?v={TAG}", js)
          js = js.replace("20260908-user-headshot-1", TAG)
          js = js.replace("20260908-hero-hotfix-2", TAG)
          js = js.replace("20260908-hero-hotfix-1", TAG)

          # Remove the function body that changed .ez-hero-portrait.src at runtime.
          js, swapped = re.subn(
              r'\n\s*function installHeroPortrait\(\)\{.*?\n\s*\}\n',
              '\n  function installHeroPortrait(){}\n',
              js,
              count=1,
              flags=re.S,
          )
          if swapped != 1:
              raise SystemExit("Could not locate installHeroPortrait runtime swap")

          # Remove any invocation too, so no hero portrait DOM mutation path remains.
          js = re.sub(r'\n\s*installHeroPortrait\(\);', '', js)
          nav.write_text(js, encoding="utf-8")

          # 3) Hero CSS: same release tag for nested hero assets; keep tokens in :root.
          css_file = Path("hero-final.css")
          css = css_file.read_text(encoding="utf-8")
          css = re.sub(r'\?v=2026090[78][^\'\")\s]+', f'?v={TAG}', css)
          css_file.write_text(css, encoding="utf-8")

          # 4) Assertions to prevent another split-state deployment.
          final_html = index.read_text(encoding="utf-8")
          final_js = nav.read_text(encoding="utf-8")
          assert "20260907-approved-1" not in final_html
          assert f'hero-final.css?v={TAG}' in final_html
          assert f'global-nav.js?v={TAG}' in final_html
          assert f'ez-hero-portrait-2026-hires.svg?v={TAG}' in final_html
          assert "ez-hero-portrait" not in final_js
          print("Hero unified successfully with", TAG)
          PY

      - name: Commit hero fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html global-nav.js hero-final.css
          git commit -m "Unify homepage hero assets and remove runtime portrait swap"
          git push origin HEAD:main
