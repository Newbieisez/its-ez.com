name: Use fixed 2026 headshot for homepage hero

on:
  push:
    paths:
      - .github/workflows/one-time-unify-hero-20260908.yml

permissions:
  contents: write

jobs:
  install-headshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point hero to fixed SVG
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          TAG = '20260908-headshot-fixed-svg-1'
          SOURCE_FS = Path('assets/headshot2026fixed.svg')
          SOURCE_WEB = 'assets/headshot2026fixed.svg'

          if not SOURCE_FS.exists():
              raise SystemExit('Fixed headshot SVG is missing from assets')
          if SOURCE_FS.stat().st_size < 500_000:
              raise SystemExit(f'Fixed headshot SVG is unexpectedly small: {SOURCE_FS.stat().st_size} bytes')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html, count = re.subn(
              r'<img\s+class="ez-hero-portrait"[^>]*>',
              f'<img class="ez-hero-portrait" src="{SOURCE_WEB}?v={TAG}" alt="Erez Haimowicz" width="600" height="600" loading="eager" fetchpriority="high" decoding="async">',
              html,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Expected one hero portrait element, changed {count}')

          index.write_text(html, encoding='utf-8')

          css = Path('homepage-extras.css').read_text(encoding='utf-8')
          portrait_rule = re.search(r'body\.ez-homepage \.hero\.hero-2026 \.ez-hero-portrait\s*\{(.*?)\}', css, re.S)
          if not portrait_rule:
              raise SystemExit('Hero portrait CSS rule missing')
          if 'content:' in portrait_rule.group(1).lower():
              raise SystemExit('Hero CSS is overriding the image source')

          final_html = index.read_text(encoding='utf-8')
          assert f'src="{SOURCE_WEB}?v={TAG}"' in final_html
          print(f'Using fixed hero: {SOURCE_FS} ({SOURCE_FS.stat().st_size} bytes)')
          PY

          test -s "assets/headshot2026fixed.svg"
          grep -q 'src="assets/headshot2026fixed.svg?v=20260908-headshot-fixed-svg-1"' index.html

      - name: Commit homepage headshot switch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Use fixed 2026 SVG headshot in homepage hero"
          git push origin HEAD:main
