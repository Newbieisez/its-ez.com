name: Clean broken homepage hero assets

on:
  push:
    paths:
      - .github/workflows/one-time-unify-hero-20260908.yml

permissions:
  contents: write

jobs:
  clean-hero-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove broken hero files and normalize references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          TAG = '20260908-asset-cleanup-1'
          FALLBACK = 'assets/ez-hero-black-shirt-v2.jpg'
          BROKEN_NAMES = [
              'ez-headshot-500-fixed.svg',
              'ez-headshot-20260908-fixed.svg',
              'ez-hero-portrait-2026-hires.svg',
          ]

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = re.sub(
              r'<img\s+class="ez-hero-portrait"[^>]*>',
              f'<img class="ez-hero-portrait" src="{FALLBACK}?v={TAG}" alt="Erez Haimowicz" width="500" height="500" loading="eager" fetchpriority="high" decoding="async">',
              html,
              count=1,
              flags=re.S,
          )
          html = html.replace('homepage-extras.css?v=20260908-headshot-rescue-1', f'homepage-extras.css?v={TAG}')
          html = html.replace('global-nav.js?v=20260908-headshot-rescue-1', f'global-nav.js?v={TAG}')
          index.write_text(html, encoding='utf-8')

          css_path = Path('homepage-extras.css')
          css = css_path.read_text(encoding='utf-8')
          # The img element owns its source. CSS must never swap image bytes.
          css = re.sub(r'\n\s*content\s*:\s*url\([^;]+\)\s*!important\s*;', '', css, flags=re.I)
          for name in BROKEN_NAMES:
              css = css.replace(name, 'ez-hero-black-shirt-v2.jpg')
          css = css.replace('20260908-headshot-rescue-1', TAG)
          css_path.write_text(css, encoding='utf-8')

          nav_path = Path('global-nav.js')
          js = nav_path.read_text(encoding='utf-8')
          js = re.sub(r"const VERSION = '[^']+';", f"const VERSION = '{TAG}';", js, count=1)
          js = js.replace('20260908-headshot-rescue-1', TAG)
          for name in BROKEN_NAMES:
              js = js.replace(name, 'ez-hero-black-shirt-v2.jpg')
          nav_path.write_text(js, encoding='utf-8')

          # Remove the malformed / duplicate portrait files from the repo.
          for rel in [
              'assets/ez-headshot-500-fixed.svg',
              'assets/ez-headshot-20260908-fixed.svg',
              'assets/ez-hero-portrait-2026-hires.svg',
          ]:
              p = Path(rel)
              if p.exists():
                  p.unlink()

          # Remove the accidental staging payload from the previous rescue attempt.
          staging = Path('.github/hero-headshot/part0.b64')
          if staging.exists():
              staging.unlink()
              try:
                  staging.parent.rmdir()
              except OSError:
                  pass

          # Hard verification: no live code may reference the removed files.
          check_files = [Path('index.html'), Path('homepage-extras.css'), Path('global-nav.js')]
          joined = '\n'.join(p.read_text(encoding='utf-8') for p in check_files)
          for name in BROKEN_NAMES:
              assert name not in joined, f'Broken asset still referenced: {name}'
          assert f'src="{FALLBACK}?v={TAG}"' in index.read_text(encoding='utf-8')
          portrait_rule = re.search(r'body\.ez-homepage \.hero\.hero-2026 \.ez-hero-portrait\s*\{(.*?)\}', css_path.read_text(encoding='utf-8'), re.S)
          assert portrait_rule, 'Hero portrait CSS rule missing'
          assert 'content:' not in portrait_rule.group(1).lower(), 'CSS still overrides portrait source'
          assert Path(FALLBACK).exists(), 'Fallback JPG missing'
          assert Path(FALLBACK).stat().st_size > 1000, 'Fallback JPG is unexpectedly tiny'
          print('Hero asset cleanup verified.')
          PY

          git grep -n -E 'ez-headshot-500-fixed|ez-headshot-20260908-fixed|ez-hero-portrait-2026-hires' -- ':!*.yml' && exit 1 || true
          test -s assets/ez-hero-black-shirt-v2.jpg

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html homepage-extras.css global-nav.js assets .github/hero-headshot || true
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Clean broken hero assets and restore valid portrait fallback"
          git push origin HEAD:main
