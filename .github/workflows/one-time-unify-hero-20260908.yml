name: One-time rescue homepage hero

on:
  push:
    paths:
      - .github/workflows/one-time-unify-hero-20260908.yml

permissions:
  contents: write

jobs:
  fix-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace corrupted hero asset
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          TAG = "20260908-headshot-rescue-1"
          OLD = "assets/ez-hero-portrait-2026-hires.svg"
          NEW = "assets/ez-headshot-500-fixed.svg"

          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          html = re.sub(r'\?v=[^"\'\s>]+', f'?v={TAG}', html)
          html = html.replace(OLD, NEW)
          html = re.sub(
              r'<img\s+class="ez-hero-portrait"[^>]*>',
              f'<img class="ez-hero-portrait" src="{NEW}?v={TAG}" alt="Erez Haimowicz in a black blazer and black shirt" width="500" height="500" loading="eager" fetchpriority="high" decoding="async">',
              html,
              count=1,
              flags=re.S,
          )
          index.write_text(html, encoding="utf-8")

          css_file = Path("homepage-extras.css")
          css = css_file.read_text(encoding="utf-8")
          css = css.replace("ez-hero-portrait-2026-hires.svg", "ez-headshot-500-fixed.svg")
          css = re.sub(r'\?v=[^\'\")\s]+', f'?v={TAG}', css)
          css_file.write_text(css, encoding="utf-8")

          nav = Path("global-nav.js")
          js = nav.read_text(encoding="utf-8")
          js = re.sub(r"const VERSION = '[^']+';", f"const VERSION = '{TAG}';", js, count=1)
          js = re.sub(r"responsive-2026\.css\?v=[^'\"]+", f"responsive-2026.css?v={TAG}", js)
          nav.write_text(js, encoding="utf-8")

          final_html = index.read_text(encoding="utf-8")
          final_css = css_file.read_text(encoding="utf-8")
          final_js = nav.read_text(encoding="utf-8")

          assert OLD not in final_html
          assert OLD not in final_css
          assert f'{NEW}?v={TAG}' in final_html
          assert f'ez-headshot-500-fixed.svg?v={TAG}' in final_css
          assert f'homepage-extras.css?v={TAG}' in final_html
          assert f'global-nav.js?v={TAG}' in final_html
          assert f"const VERSION = '{TAG}';" in final_js
          assert f"responsive-2026.css?v={TAG}" in final_js
          print("Verified headshot rescue applied:", TAG)
          PY

      - name: Commit hero rescue
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html homepage-extras.css global-nav.js
          git commit -m "Replace corrupted hero portrait with verified headshot asset"
          git push origin HEAD:main
