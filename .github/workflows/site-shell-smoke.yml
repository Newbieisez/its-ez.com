name: Site Shell Smoke

on:
  push:
    branches: [main]
    paths:
      - 'global-nav.js'
      - 'services-catalog.js'
      - 'index.html'
      - 'work-with-me.html'
      - 'revenue-performance.html'
      - 'ai-systems.html'
      - 'music.html'
      - 'recommendations.html'
      - 'homepage-extras.css'
      - '.github/workflows/site-shell-smoke.yml'
  pull_request:
    paths:
      - 'global-nav.js'
      - 'services-catalog.js'
      - 'index.html'
      - 'work-with-me.html'
      - 'revenue-performance.html'
      - 'ai-systems.html'
      - 'music.html'
      - 'recommendations.html'
      - 'homepage-extras.css'
      - '.github/workflows/site-shell-smoke.yml'

permissions:
  contents: read

jobs:
  validate-site-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check global-nav.js
          node --check services-catalog.js

      - name: Primary navigation assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -F "['Results',ROOT+'#results']" global-nav.js
          grep -F "['How I Build',ROOT+'#operating']" global-nav.js
          grep -F "['AI Systems',ROOT+'ai-systems.html']" global-nav.js
          grep -F "['Products',ROOT+'store.html']" global-nav.js
          grep -F 'data-ez-label="Shop">Shop</a>' global-nav.js
          grep -F '<strong>Shop Products</strong>' global-nav.js
          test -f meet/index.html
          grep -F 'calendly.com/itsez/executive-enablement-advisory-call' meet/index.html
          if grep -F 'calendly.com/erezhaimowicz/g2e-2026-meet-with-ez' meet/index.html; then
            echo 'G2E 2026 booking link must stay off the meet page (event is over)' >&2
            exit 1
          fi
          if grep -F 'Book 20 minutes' global-nav.js; then
            echo 'G2E-era booking language must stay out of the nav' >&2
            exit 1
          fi
          test -s G2E-2026-EZ-Enablement.pdf
          test "$(head -c 4 G2E-2026-EZ-Enablement.pdf)" = "%PDF"
          if grep -F 'G2E-2026-EZ-Enablement.pdf' ez.html; then
            echo 'G2E handout must stay unlinked from the QR page' >&2
            exit 1
          fi
          grep -F "['Recommendations',ROOT+'recommendations.html']" global-nav.js
          grep -F "['Work With Me',ROOT+'work-with-me.html']" global-nav.js
          NAV_BLOCK="$(sed -n '/const navItems = \[/,/^  \];/p' global-nav.js)"
          if printf '%s\n' "$NAV_BLOCK" | grep -F "['Music'"; then
            echo 'Music must not be in primary navigation' >&2
            exit 1
          fi
          if printf '%s\n' "$NAV_BLOCK" | grep -F "['MEDDPICC'"; then
            echo 'MEDDPICC must not be in primary navigation' >&2
            exit 1
          fi
          if printf '%s\n' "$NAV_BLOCK" | grep -F "['Cybersecurity'"; then
            echo 'Cybersecurity must not be in primary navigation' >&2
            exit 1
          fi

      - name: Results board assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -F "section.id='results'" global-nav.js
          grep -F 'RESULTS / PERFORMANCE BOARD' global-nav.js
          grep -F '$13M' global-nav.js
          grep -F '40–50%' global-nav.js
          grep -F '$8M' global-nav.js
          if grep -E '\+40%|\$700K' global-nav.js; then
            echo 'Unresolved conversion and tooling-savings claims must stay off the homepage' >&2
            exit 1
          fi
          grep -F '82%' global-nav.js

      - name: Secondary links remain available
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'Revenue Performance Hub' global-nav.js
          grep -F 'MEDDPICC Lab' global-nav.js
          grep -F 'Cybersecurity Lab' global-nav.js
          grep -F '>Music</a>' global-nav.js

      - name: Cache-busted shared navigation on key pages
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html work-with-me.html ai-systems.html music.html recommendations.html revenue-performance.html; do
            grep -F 'global-nav.js?v=20260928-g2e-booking' "$f"
          done
