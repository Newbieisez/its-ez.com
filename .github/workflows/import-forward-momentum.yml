name: Import Forward Momentum audio

on:
  push:
    paths:
      - '.github/workflows/import-forward-momentum.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install import tools
        run: |
          python -m pip install --upgrade gdown
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Import Forward Momentum from existing EZ Drive share
        run: |
          mkdir -p assets/audio
          gdown '1mrVBaOA293zaiexTucMGim-POZl9peF6' -O /tmp/forward-momentum-source
          test -s /tmp/forward-momentum-source
          ffmpeg -y -i /tmp/forward-momentum-source -vn -codec:a libmp3lame -b:a 192k -ar 48000 assets/audio/forward-momentum.mp3
          test -s assets/audio/forward-momentum.mp3

      - name: Commit site-owned audio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/forward-momentum.mp3
          if git diff --cached --quiet; then
            echo 'Audio already present.'
          else
            git commit -m 'Add Forward Momentum first-party audio asset'
            git push
          fi
