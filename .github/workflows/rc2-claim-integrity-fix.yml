name: RC2 claim integrity cleanup

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'release/ez-enablement-v2-rc2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/ez-enablement-v2-rc2
          fetch-depth: 0

      - name: Remove unsupported public proof claims
        shell: python
        run: |
          from pathlib import Path
          import re

          def edit(path, replacements):
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  if old not in text:
                      print(f'WARN missing target in {path}: {old[:80]}')
                  text = text.replace(old, new)
              p.write_text(text)

          edit('index.html', [
              ('Observable 5-point rubric systems, active methodology deal labs, 45-day onboarding blueprints, and practical AI fluency workflows. Engineered by frontline revenue leaders with verified track records at SentinelOne, Twilio, Tessian, and Cofense.',
               'Observable 5-point rubric systems, active methodology deal labs, structured onboarding blueprints, and practical AI fluency workflows. Built from frontline revenue and enablement experience across SentinelOne, Twilio, Tessian, and Cofense.'),
              ('      <div class="proof-item">\n        <span class="proof-stat">96%</span>\n        <span class="proof-label">Historical Certification Pass</span>\n      </div>\n', ''),
              ('      <div class="proof-item">\n        <span class="proof-stat">100%</span>\n        <span class="proof-label">Historical Stage Adoption</span>\n      </div>\n', ''),
              ('<h3 style="font-size: 24px; font-weight: 800; color: var(--slate-900); margin-bottom: 12px;">Verified Enterprise Case Studies</h3>',
               '<h3 style="font-size: 24px; font-weight: 800; color: var(--slate-900); margin-bottom: 12px;">Selected Enterprise Experience</h3>'),
              ('Consolidated $700K in overlapping sales tool spend, built the Purple Book intelligence dashboard, and trained 1,000+ reps globally.',
               'Consolidated $700K in overlapping sales tool spend and built the Purple Book intelligence dashboard to support global seller enablement.'),
              ('Architected a 5-module seller accreditation framework and conversational intelligence analytics in Gong, lifting win rates by 18%.',
               'Architected a 5-module seller accreditation framework and paired it with conversational intelligence analytics in Gong.'),
          ])

          edit('case-study-sentinelone.html', [
              ('<span><strong>Outcome:</strong> $700K Saved • 96% Certification Pass Rate</span>',
               '<span><strong>Outcome:</strong> $700K Tooling Consolidation • Global Enablement Program</span>'),
              ('Created and launched a gamified sales kickoff certification curriculum certifying 1,000+ reps and partners globally.',
               'Created and launched a gamified sales kickoff certification curriculum for reps and partners globally.'),
          ])

          edit('case-study-twilio.html', [
              ('<span><strong>Outcome:</strong> 18% Win Rate Lift • 100% Behavioral Certification</span>',
               '<span><strong>Outcome:</strong> SOAR Accreditation Framework • Gong Telemetry</span>'),
              ('Reps certified through the SOAR framework demonstrated an 18% higher win rate compared to uncertified peers within 90 days.',
               'Connected accreditation criteria to field observation and conversation-intelligence signals to strengthen coaching consistency and adoption.'),
          ])

          edit('about.html', [
              ('Tessian, Cofense, Mimecast, Proofpoint, ReUp:</strong> Led onboarding architectures that cut rep time-to-first-meeting from 90 days down to 45 days.',
               'Tessian, Cofense, Mimecast, Proofpoint, ReUp:</strong> Built onboarding and enablement architectures focused on accelerating seller readiness and field execution.'),
          ])

          # Replace anonymous/unverifiable testimonials with a transparent references statement.
          p = Path('recommendations.html')
          text = p.read_text()
          start = text.index('    <div class="section-header">')
          end = text.index('  </main>', start)
          replacement = '''    <div class="section-header">\n      <h2>References & Recognition</h2>\n      <p>Public case studies on this site reflect documented practitioner work. Additional professional references and recognition can be shared during a qualified business conversation.</p>\n    </div>\n    <div style="background: white; border: 1px solid var(--slate-200); padding: 28px; border-radius: var(--radius-md); max-width: 820px; margin: 0 auto;">\n      <h3 style="font-size: 18px; font-weight: 800; color: var(--slate-900); margin-bottom: 10px;">Evidence over anonymous testimonials</h3>\n      <p style="font-size: 14px; color: var(--slate-700); line-height: 1.7;">EZ Enablement does not publish unattributed customer quotes as proof. Where a metric or outcome is shown, it should be tied to documented historical practitioner experience or a named case study. References are available upon request when appropriate.</p>\n    </div>\n'''
          text = text[:start] + replacement + text[end:]
          p.write_text(text)

          # Make sandbox state explicit anywhere the old checkout security tagline appears.
          for p in Path('.').glob('*.html'):
              text = p.read_text()
              text = text.replace('Instant Digital Asset Access • 256-bit Encrypted Transaction',
                                  'Sandbox Checkout • No live charges until production activation')
              p.write_text(text)

      - name: Verify removed claims
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE '96% Certification Pass|100% Behavioral Certification|18% (higher )?win rate|lifting win rates by 18%|cut our new AE onboarding ramp time in half|rare enablement leaders' -- *.html
          grep -q 'Evidence over anonymous testimonials' recommendations.html
          grep -q 'SOAR Accreditation Framework • Gong Telemetry' case-study-twilio.html
          grep -q '$700K Tooling Consolidation • Global Enablement Program' case-study-sentinelone.html

      - name: Commit claim cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EZ Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html case-study-sentinelone.html case-study-twilio.html about.html recommendations.html *.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(release): remove unsupported proof claims from RC2'
          git push origin HEAD:release/ez-enablement-v2-rc2
