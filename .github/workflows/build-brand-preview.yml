name: Build full-story brand preview

on:
  push:
    branches:
      - preview/ez-brand-full-story-2026-09-11

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/ez-brand-full-story-2026-09-11
          fetch-depth: 0
      - name: Add full-story preview treatment
        shell: bash
        run: |
          if grep -q "EZ BRAND FULL STORY PREVIEW" global-nav.js; then
            echo "Preview patch already present."
            exit 0
          fi
          cat brand-preview.js >> global-nav.js
          node --check global-nav.js
          git config user.name "EZ Preview Builder"
          git config user.email "actions@users.noreply.github.com"
          git add global-nav.js
          git commit -m "Add full-story homepage preview treatment"
          git push origin HEAD:preview/ez-brand-full-story-2026-09-11
