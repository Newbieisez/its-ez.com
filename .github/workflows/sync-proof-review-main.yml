name: Sync proof review with main

on:
  push:
    branches:
      - preview/ez-proof-review-2026-09-11
    paths:
      - '.github/workflows/sync-proof-review-main.yml'

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/ez-proof-review-2026-09-11
          fetch-depth: 0
      - name: Merge latest main safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EZ Preview Builder'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Validate review JavaScript
        run: |
          node --check global-nav.js
          node --check projects-core.js
          node --check proof-preview.js
      - name: Clean sync workflow and push
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/sync-proof-review-main.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove temporary proof review sync workflow'
          fi
          git push origin HEAD:preview/ez-proof-review-2026-09-11
