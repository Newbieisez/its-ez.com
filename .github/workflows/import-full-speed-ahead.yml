name: Import Full Speed Ahead audio

on:
  push:
    paths:
      - '.github/workflows/import-full-speed-ahead.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install audio tools
        run: |
          python -m pip install --upgrade yt-dlp
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Import Full Speed Ahead
        run: |
          mkdir -p assets/audio
          yt-dlp \
            --no-playlist \
            -x \
            --audio-format mp3 \
            --audio-quality 0 \
            -o 'assets/audio/full-speed-ahead.%(ext)s' \
            'https://soundcloud.com/haimonix/full-speed-ahead-yacht-rock/s-XCooCM1Kq6V'
          test -s assets/audio/full-speed-ahead.mp3

      - name: Commit site-owned audio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/full-speed-ahead.mp3
          if git diff --cached --quiet; then
            echo 'Audio already present.'
          else
            git commit -m 'Add Full Speed Ahead first-party audio asset'
            git push
          fi
