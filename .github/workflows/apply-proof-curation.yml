name: Apply proof curation preview

on:
  push:
    branches:
      - preview/ez-proof-review-2026-09-11
    paths:
      - 'proof-curation-patch.py'
      - '.github/workflows/apply-proof-curation.yml'

permissions:
  contents: write

jobs:
  curate-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/ez-proof-review-2026-09-11
          fetch-depth: 0
      - name: Apply proof and credibility changes
        run: python proof-curation-patch.py
      - name: Validate JavaScript
        run: |
          node --check global-nav.js
          node --check projects-core.js
          node --check proof-preview.js
      - name: Validate proof assets and copy
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/proof/sentinelone-culture-champion.webp
          test -s assets/proof/twilio-trainer-mentor.webp
          test -s assets/proof/twilio-sko-recognition.webp
          test -s assets/proof/reup-vivo-training.webp
          test -s assets/proof/gong-spotlight-ez.webp
          grep -F 'proof-preview.js?v=20260911-proof-curation-1' index.html
          grep -F 'A few receipts from the work itself.' proof-preview.js
          grep -F 'Prior MEDDPICC work:' index.html
          grep -F 'Global readiness system' projects-core.js
          grep -F 'Readiness system spanning training, methodology, coaching, and workflow' global-nav.js
          if grep -F '+40% stage conversion lift' index.html; then exit 1; fi
          if grep -F "['+40%','Deal conversion lift']" projects-core.js; then exit 1; fi
          if grep -F 'Annual GTM technology savings' projects-core.js; then exit 1; fi
      - name: Commit clean preview state
        shell: bash
        run: |
          set -euo pipefail
          rm -f proof-curation-patch.py .github/workflows/apply-proof-curation.yml
          git config user.name 'EZ Preview Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Curate proof artifacts and tighten public claims'
          git push origin HEAD:preview/ez-proof-review-2026-09-11
