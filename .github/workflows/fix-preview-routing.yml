name: Fix preview routing

on:
  push:
    branches:
      - preview/ez-brand-full-story-2026-09-11
    paths:
      - preview-link-fix.py
      - .github/workflows/fix-preview-routing.yml

permissions:
  contents: write

jobs:
  fix-preview-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/ez-brand-full-story-2026-09-11
          fetch-depth: 0
      - name: Patch preview routing
        run: python preview-link-fix.py
      - name: Validate JavaScript
        run: node --check global-nav.js
      - name: Commit routing fix
        shell: bash
        run: |
          git config user.name "EZ Preview Builder"
          git config user.email "actions@users.noreply.github.com"
          git add global-nav.js
          git commit -m "Keep preview navigation inside preview"
          git push origin HEAD:preview/ez-brand-full-story-2026-09-11
