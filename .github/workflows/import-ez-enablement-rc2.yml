name: Import EZ Enablement V2 RC2 snapshot

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-rc2:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'release/ez-enablement-v2-rc2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out RC2 review branch
        uses: actions/checkout@v4
        with:
          ref: release/ez-enablement-v2-rc2
          fetch-depth: 0

      - name: Download exact RC2 archive from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            'https://drive.usercontent.google.com/download?id=14HO3i_ZH8jvmE-9IUe7n9ZYcVdauMtMR&export=download&confirm=t' \
            -o /tmp/ez-rc2.zip
          test -s /tmp/ez-rc2.zip
          unzip -t /tmp/ez-rc2.zip

      - name: Extract and validate release allowlist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ez-rc2
          mkdir -p /tmp/ez-rc2
          unzip -q /tmp/ez-rc2.zip -d /tmp/ez-rc2

          cat > /tmp/expected.txt <<'EOF'
          HANDOFF-MANIFEST.md
          _headers
          about.html
          ai.html
          app.js
          case-study-sentinelone.html
          case-study-twilio.html
          docs/BUILD-BRIEF.md
          docs/QA-CHECKLIST.md
          docs/SITE-MAP.md
          favicon.svg
          how-i-help.html
          index.html
          labs.html
          launch_tracker.md
          music.html
          products-data.js
          recommendations.html
          robots.txt
          sitemap.xml
          store.html
          styles.css
          work.html
          EOF

          find /tmp/ez-rc2 -type f | sed 's#^/tmp/ez-rc2/##' | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test "$(wc -l < /tmp/actual.txt)" -eq 23

      - name: Block secrets and paid archive leakage
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE --binary-files=without-match \
            'sk_live_[A-Za-z0-9]+|rk_live_[A-Za-z0-9]+|whsec_[A-Za-z0-9]+|GOCSPX-[A-Za-z0-9_-]+|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' \
            /tmp/ez-rc2; then
            echo 'Sensitive credential pattern detected; refusing import.' >&2
            exit 1
          fi

          if find /tmp/ez-rc2 -type f -iname '*.zip' | grep -q .; then
            echo 'Nested paid ZIP/archive detected; refusing import.' >&2
            exit 1
          fi

      - name: Apply verified handoff corrections
        shell: python
        run: |
          from pathlib import Path
          root = Path('/tmp/ez-rc2')

          tracker = root / 'launch_tracker.md'
          tracker.write_text(
              tracker.read_text().replace(
                  'consultative consultative sales motions',
                  'consultative sales motions'
              )
          )

          robots = root / 'robots.txt'
          robots.write_text(
              robots.read_text().replace(
                  'https://ez-enablement.com/sitemap.xml',
                  'https://its-ez.com/sitemap.xml'
              )
          )

          routes = [
              '/', '/store.html', '/labs.html', '/how-i-help.html', '/ai.html',
              '/work.html', '/case-study-sentinelone.html', '/case-study-twilio.html',
              '/about.html', '/recommendations.html', '/music.html'
          ]
          sitemap = ['<?xml version="1.0" encoding="UTF-8"?>',
                     '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for i, route in enumerate(routes):
              sitemap.extend([
                  '  <url>',
                  f'    <loc>https://its-ez.com{route}</loc>',
                  '    <lastmod>2026-09-22</lastmod>',
                  f'    <changefreq>{"weekly" if i == 0 else "monthly"}</changefreq>',
                  f'    <priority>{"1.0" if i == 0 else "0.8"}</priority>',
                  '  </url>',
              ])
          sitemap.append('</urlset>')
          (root / 'sitemap.xml').write_text('\n'.join(sitemap) + '\n')

          manifest = root / 'HANDOFF-MANIFEST.md'
          text = manifest.read_text()
          archive_block = '## ARCHIVE\n`EZ-Enablement-V2-2026-09-22-production-v2-RC2.zip`\n'
          if '## ARCHIVE' not in text:
              text = text.replace('## DATE\n`2026-09-22`\n',
                                  '## DATE\n`2026-09-22`\n\n' + archive_block)
          manifest.write_text(text)

      - name: Overlay the 23 verified RC2 files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            mkdir -p "$(dirname "$file")"
            cp "/tmp/ez-rc2/$file" "$file"
          done < /tmp/expected.txt

      - name: Post-overlay release checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Sitemap: https://its-ez.com/sitemap.xml' robots.txt
          grep -q '<loc>https://its-ez.com/</loc>' sitemap.xml
          ! grep -Rni 'https://ez-enablement.com' robots.txt sitemap.xml
          grep -q '2.0.0-rc2' launch_tracker.md
          test "$(grep -c '^| \*\*' launch_tracker.md)" -eq 14
          ! grep -Rni 'consultative consultative' launch_tracker.md

      - name: Commit RC2 snapshot to review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EZ Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add HANDOFF-MANIFEST.md _headers about.html ai.html app.js \
            case-study-sentinelone.html case-study-twilio.html docs/BUILD-BRIEF.md \
            docs/QA-CHECKLIST.md docs/SITE-MAP.md favicon.svg how-i-help.html \
            index.html labs.html launch_tracker.md music.html products-data.js \
            recommendations.html robots.txt sitemap.xml store.html styles.css work.html
          if git diff --cached --quiet; then
            echo 'RC2 snapshot already matches branch.'
            exit 0
          fi
          git commit -m 'chore(release): EZ Enablement V2 rc2 - commercial claim corrections, preview redaction & launch tracker alignment (v2.0.0-rc2)'
          git push origin HEAD:release/ez-enablement-v2-rc2
