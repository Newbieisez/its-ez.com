<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Eight-week enablement accelerator architecture placeholder</title>
  <desc id="desc">A Canva-ready placeholder showing an eight-week enablement accelerator from diagnosis through scale.</desc>
  <defs>
    <pattern id="grain" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="760" fill="#101010"/>
  <rect width="1200" height="760" fill="url(#grain)"/>
  <text x="64" y="74" fill="#d9ef67" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3">CANVA SLOT 02 / 1200 × 760</text>
  <text x="64" y="132" fill="#ffffff" font-family="Georgia, serif" font-size="50">Eight weeks from friction to field.</text>
  <g font-family="Arial, Helvetica, sans-serif">
