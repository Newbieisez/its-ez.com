    <path d="M64 506h1072" stroke="#d9ef67" stroke-width="4"/><path d="M1136 506l-24-17v34z" fill="#d9ef67"/>
    <g fill="#ffffff" font-size="16"><text x="64" y="560">Executive alignment</text><text x="366" y="560">Role-based capability</text><text x="672" y="560">Observed practice</text><text x="950" y="560">Performance telemetry</text></g>
    <text x="64" y="708" fill="#9f9f9f" font-size="14">Replace this SVG with the final Canva export using the same filename.</text>
