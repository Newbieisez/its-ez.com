<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Website responsive release check</title><style>body{margin:0;padding:16px;background:#e6e7e9;font:16px system-ui;color:#151515}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}button{padding:10px 14px;cursor:pointer}iframe{display:block;width:390px;max-width:100%;height:800px;border:1px solid #bbb;background:white}p{margin:0 0 14px}</style></head><body><p>Website release check · responsive viewport</p><nav aria-label="Preview controls"><button data-page="work-with-me.html">Services preview</button><button data-page="index.html">Home preview</button><button data-width="390">390 pixels</button><button data-width="768">768 pixels</button><button data-width="1200">1200 pixels</button></nav><iframe title="Website preview" src="./work-with-me.html"></iframe><script>const frame=document.querySelector('iframe');document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>{frame.src='./'+button.dataset.page}));document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{frame.style.width=button.dataset.width+'px'}));</script></body></html>
